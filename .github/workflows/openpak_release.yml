name: OpenPak release

# Tag v1.2.3: Linux x86_64, Windows x64, macOS arm64 (Qt GUI) and Android (debug-signed APK) builds on a GitHub
# Release. The release is created first and every build attaches its own file to it, so a
# release never waits on workflow artifacts (the organisation's artifact quota can be full).
# workflow_dispatch builds without publishing.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          name: Dolphin ${{ github.ref_name }} (OpenPak)
          generate_release_notes: true

  linux:
    needs: [release]
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # openpak-client is private: GITHUB_TOKEN reads only this repo.
          token: ${{ secrets.OPENPAK_MODULE_TOKEN || github.token }}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential git cmake ninja-build pkg-config \
            ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libevdev-dev libudev-dev \
            libusb-1.0-0-dev libxrandr-dev libxi-dev libpangocairo-1.0-0 qt6-base-dev qt6-base-private-dev \
            qt6-svg-dev libbluetooth-dev libasound2-dev libpulse-dev libgl1-mesa-dev libcurl4-openssl-dev \
            libsystemd-dev libminiupnpc-dev libmbedtls-dev libhidapi-dev libpng-dev libpugixml-dev \
            libsfml-dev libenet-dev libxxhash-dev libzstd-dev liblzma-dev libspng-dev \
            libfmt-dev libxext-dev libgtk-3-dev libssl-dev libarchive-dev
      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLINUX_LOCAL_DEV=true
      - run: cmake --build build -j$(nproc)
      - run: |
          cd build/Binaries && tar czf ../../dolphin-openpak-${GITHUB_REF_NAME}-linux-x86_64.tar.gz . && cd ../.. && ls -la *.tar.gz
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dolphin-openpak-*.tar.gz

  macos:
    needs: [release]
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # openpak-client is private: GITHUB_TOKEN reads only this repo.
          token: ${{ secrets.OPENPAK_MODULE_TOKEN || github.token }}
      - run: brew install cmake ninja qt@6 ffmpeg openssl@3
      - run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)"
          -DENABLE_TESTS=OFF -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" -DOPENSSL_USE_STATIC_LIBS=ON
      - run: cmake --build build -j$(sysctl -n hw.ncpu)
      - run: cd build/Binaries && zip -r -y ../../dolphin-openpak-${GITHUB_REF_NAME}-macos-arm64.zip Dolphin.app
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dolphin-openpak-*.zip

  windows:
    needs: [release]
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    # Dolphin needs Visual Studio 2026 (Source/PCH/pch.h).
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # openpak-client is private: GITHUB_TOKEN reads only this repo.
          token: ${{ secrets.OPENPAK_MODULE_TOKEN || github.token }}
      # openpak-client speaks HTTPS through OpenSSL; linked statically so the zip needs no DLLs.
      - run: vcpkg install openssl:x64-windows-static-md
      - shell: bash
        run: >
          cmake -B build -G "Visual Studio 18 2026" -A x64 -DENABLE_TESTS=OFF
          -DOPENSSL_ROOT_DIR="$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md" -DOPENSSL_USE_STATIC_LIBS=ON
      - run: cmake --build build --config Release -- /m
      - shell: bash
        # Dolphin's CMake puts Dolphin.exe and its DLLs in Binaries/ itself, not Binaries/<config>/.
        run: cd build/Binaries && 7z a ../../dolphin-openpak-${GITHUB_REF_NAME}-windows-x64.zip . >/dev/null && ls -la ../../*.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dolphin-openpak-*.zip

  android:
    # The same recipe as a local build: JDK 17, the SDK's NDK 30 / platform 37, Gradle.
    # The CMake step downloads the pinned prebuilt OpenSSL (CMake/OpenPakAndroidOpenSSL.cmake).
    # Debug-signed: installable beside Play-store Dolphin (org.dolphinemu.dolphinemu.debug).
    needs: [release]
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          # openpak-client is private: GITHUB_TOKEN reads only this repo.
          token: ${{ secrets.OPENPAK_MODULE_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.15729638" "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.31.6"
      - working-directory: Source/Android
        run: ./gradlew --no-daemon assembleDebug
      - run: cp Source/Android/app/build/outputs/apk/debug/app-debug.apk dolphin-openpak-${GITHUB_REF_NAME}-android.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dolphin-openpak-*.apk
