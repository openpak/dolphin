name: OpenPak release

# Tag openpak-v1.2.3: a Linux x86_64 build (Qt GUI) attached to a GitHub Release.
on:
  push:
    tags: ['openpak-v*']
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential git cmake ninja-build pkg-config \
            ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libevdev-dev libudev-dev \
            libusb-1.0-0-dev libxrandr-dev libxi-dev libpangocairo-1.0-0 qt6-base-dev qt6-base-private-dev \
            qt6-svg-dev libbluetooth-dev libasound2-dev libpulse-dev libgl1-mesa-dev libcurl4-openssl-dev \
            libsystemd-dev libminiupnpc-dev libmbedtls-dev libhidapi-dev libpng-dev libpugixml-dev \
            libsfml-dev libenet-dev libxxhash-dev libzstd-dev liblzma-dev libspng-dev \
            libfmt-dev libxext-dev libgtk-3-dev
      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLINUX_LOCAL_DEV=true
      - run: cmake --build build -j$(nproc)
      - run: |
          cd build/Binaries && tar czf ../../dolphin-openpak-${GITHUB_REF_NAME}-linux-x86_64.tar.gz . && cd ../.. && ls -la *.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-openpak-linux-x86_64
          path: dolphin-openpak-*.tar.gz
          retention-days: 3
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: brew install cmake ninja qt@6 ffmpeg
      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" -DENABLE_TESTS=OFF
      - run: cmake --build build -j$(sysctl -n hw.ncpu)
      - run: cd build/Binaries && zip -r -y ../../dolphin-openpak-${GITHUB_REF_NAME}-macos-arm64.zip Dolphin.app
      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-openpak-macos-arm64
          path: dolphin-openpak-*.zip
          retention-days: 3
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DENABLE_TESTS=OFF
      - run: cmake --build build --config Release -- /m
      - shell: bash
        run: cd build/Binaries/Release && 7z a ../../../dolphin-openpak-${GITHUB_REF_NAME}-windows-x64.zip . >/dev/null && ls -la ../../../*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-openpak-windows-x64
          path: dolphin-openpak-*.zip
          retention-days: 3
  release:
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/openpak-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: gh release create "${GITHUB_REF_NAME}" artifacts/* --repo "${GITHUB_REPOSITORY}" --title "Dolphin ${GITHUB_REF_NAME} (OpenPak)" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
